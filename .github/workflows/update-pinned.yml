name: Update Pinned Repositories
on:
  schedule:
    # every 6 hours — catches any change to your pinned repos automatically
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "updatePinnedRepos.js"
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch pinned repos & update README
        id: update
        env:
          GH_TOKEN: ${{ secrets.PINNED_REPOS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node updatePinnedRepos.js
      - name: Commit & push if changed
        env:
          REPO_COUNT: ${{ steps.update.outputs.repo_count }}
          REPO_NAMES: ${{ steps.update.outputs.repo_names }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/pinned
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: refresh pinned repos ($REPO_COUNT repos) - $TIMESTAMP" -m "Updated: $REPO_NAMES"
            git push
          else
            echo "No changes to commit."
          fi
